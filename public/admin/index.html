<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>إدارة محتوى Team Salon</title>
  <style>
    :root{color-scheme:dark;--bg:#0d0d0d;--panel:#171717;--text:#f7f2e8;--muted:#b5aea2;--accent:#c89b55;--line:#303030}
    html{direction:ltr}main{direction:rtl}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;background:radial-gradient(circle at 80% 20%,#2a2117 0,transparent 35%),var(--bg);color:var(--text);font-family:Arial,"Noto Sans Arabic",sans-serif;padding:24px}
    main{width:640px;max-width:calc(100vw - 48px);margin:auto;background:rgba(23,23,23,.94);border:1px solid var(--line);border-radius:16px;padding:40px;box-shadow:0 18px 60px rgba(0,0,0,.28)}
    .eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;font-size:14px}h1{font-size:clamp(28px,5vw,42px);margin:12px 0 14px;line-height:1.25}p{color:var(--muted);font-size:17px;line-height:1.8;margin:0 0 24px}.actions{display:flex;gap:12px;flex-wrap:wrap}a{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:700}.primary{background:var(--accent);color:#17120b}.secondary{border:1px solid var(--line);color:var(--text)}.note{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}a:focus-visible{outline:3px solid #fff;outline-offset:3px}
    @media(max-width:520px){main{padding:28px 22px}.actions a{width:100%}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">TEAM SALON · CMS</div>
    <h1>إدارة المحتوى والمقالات</h1>
    <p>افتح لوحة Pages CMS، ثم سجّل الدخول بحساب GitHub المصرّح له لإدارة المقالات والخدمات والعروض وبيانات الفرع.</p>
    <div class="actions">
      <a class="primary" href="https://app.pagescms.org" target="_blank" rel="noopener">فتح لوحة المحتوى</a>
      <a class="secondary" href="../">العودة إلى الموقع</a>
    </div>
    <div class="note">البريد المعتمد لمسؤول SEO: ahmedusof0@gmail.com</div>
  </main>
</body>
</html>
